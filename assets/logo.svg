<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AnalyticsAgent Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 10% safe margin baked in (12px inset on 128x128 canvas) -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="3.5"/>

  <!-- Multi-agent hub-and-spoke connections -->
  <g stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="54" x2="36" y2="38"/>
    <line x1="64" y1="54" x2="92" y2="38"/>
    <line x1="64" y1="54" x2="40" y2="86"/>
    <line x1="64" y1="54" x2="88" y2="86"/>
  </g>

  <!-- Data analytics bars at bottom -->
  <g fill="url(#accentGrad)" opacity="0.95">
    <rect x="50" y="79" width="7" height="15" rx="2.5"/>
    <rect x="60.5" y="72" width="7" height="22" rx="2.5"/>
    <rect x="71" y="66" width="7" height="28" rx="2.5"/>
  </g>

  <!-- Outer agent nodes (Fabric / AWS / Science / BI-MLOps) -->
  <circle cx="36" cy="38" r="6.5" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="92" cy="38" r="6.5" fill="#0F172A" stroke="#34D399" stroke-width="3"/>
  <circle cx="40" cy="86" r="5.5" fill="#0F172A" stroke="#818CF8" stroke-width="3"/>
  <circle cx="88" cy="86" r="5.5" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/>

  <!-- Central Orchestrator Hub -->
  <circle cx="64" cy="52" r="11" fill="url(#accentGrad)"/>
  <circle cx="64" cy="52" r="4.5" fill="#0F172A"/>
</svg>
